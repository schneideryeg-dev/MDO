<style>
  :root{

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:\'IBM Plex Sans\', sans-serif;line-height:1.55;}
  h1,h2,h3{font-family:\'Source Serif 4\', serif;font-weight:600;margin:0;color:var(--ink);}

  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:26px 32px 16px;}
  .header-inner{max-width:1160px;margin:0 auto;}
  .eyebrow{font-family:\'IBM Plex Mono\', monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  h1{font-size:24px;}
  .subtitle{color:var(--ink-soft);font-size:14px;margin-top:6px;max-width:700px;}

  .banner{margin-top:14px;font-size:13px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line-strong);
    border-radius:8px;padding:9px 14px;max-width:700px;}
  .banner strong{color:var(--ink);}

  .controls{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .controls-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;}
  .filter-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .filter-label{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#767F88;margin-right:2px;}
  .chip-btn{font-size:12px;padding:5px 10px;border:1px solid var(--line-strong);border-radius:20px;background:var(--panel);

  .chip-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}

    cursor:pointer;color:#767F88;font-family:\'IBM Plex Mono\', monospace;text-transform:uppercase;letter-spacing:.04em;}
  .reset-btn:hover{border-color:var(--ink-soft);color:var(--ink);}

    border-radius:20px;background:var(--panel);min-width:220px;color:var(--ink);}
  #search:focus{outline:none;border-color:var(--ink-soft);}

  main{max-width:1160px;margin:0 auto;padding:26px 32px 90px;}
  .category-block{margin-bottom:36px;}
  .category-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px;}
  .category-head h2{font-size:17px;}
  .category-count{font-family:\'IBM Plex Mono\', monospace;font-size:11.5px;color:#767F88;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:12px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease, border-color .12s ease;
    text-align:left;width:100%;font:inherit;}
  .tile:hover{transform:translateY(-2px);border-color:var(--line-strong);}
  .tile-name{font-family:\'Source Serif 4\', serif;font-weight:600;font-size:15px;margin-bottom:8px;}
  .tile-teaser{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .tile-count{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);}

  .backdrop{position:fixed;inset:0;background:rgba(22,35,46,0.32);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:30;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:92vw;background:var(--panel);
    box-shadow:-8px 0 30px rgba(22,35,46,0.15);transform:translateX(100%);transition:transform .22s ease;
    z-index:31;overflow-y:auto;padding:28px 26px 40px;}
  .drawer.open{transform:translateX(0);}
  .drawer-close{position:absolute;top:20px;right:20px;width:30px;height:30px;border:1px solid var(--line-strong);
    background:var(--paper);border-radius:50%;cursor:pointer;font-size:16px;line-height:1;color:var(--ink-soft);}
  .drawer-eyebrow{font-family:\'IBM Plex Mono\', monospace;font-size:11px;color:#767F88;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .drawer h2{font-size:20px;margin-bottom:6px;line-height:1.3;}
  .drawer-sub{font-family:\'IBM Plex Mono\', monospace;font-size:12px;color:#767F88;margin-bottom:20px;}
  .related-title{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#767F88;margin:0 0 10px;}
  .detail-list{list-style:none;margin:0 0 4px;padding:0;}
  .detail-list li{
    font-size:13.5px;padding:10px 12px;background:var(--paper);border-left:3px solid var(--line-strong);
    border-radius:6px;margin-bottom:8px;color:var(--ink);
  }
  .detail-source{display:block;margin-top:5px;font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#767F88;}

  footer{max-width:1160px;margin:0 auto;padding:0 32px 50px;font-size:12px;color:#767F88;border-top:1px solid var(--line);padding-top:18px;}

  @media (max-width:640px){
    header{padding:20px 18px 14px;} main{padding:22px 18px 70px;} .drawer{width:100%;max-width:100%;}
  }
</style>
</head>

const SOURCE_ORDER = ["Workshop Notes", "Workshop Transcript", "Technical Capability Assessment", "Trinus Strategic Roadmap", "Trinus Projects"];

const initiatives = [];
grouped.forEach(catGroup => {
  catGroup.initiatives.forEach(init => {
    initiatives.push({ category: catGroup.category, ...init });
  });
});
const initIndex = {}; initiatives.forEach(i => initIndex[i.id] = i);

const categories = grouped.map(c=>c.category);
let searchTerm = '';

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  let anyVisible = false;
  categories.forEach(cat=>{
    const list = initiatives.filter(i=>
      i.category===cat &&
      (searchTerm === '' ||
        i.name.toLowerCase().includes(searchTerm) ||
        i.details.some(d=>d.detail.toLowerCase().includes(searchTerm)))
    );
    if(list.length === 0) return;
    anyVisible = true;
    const block = document.createElement('div');
    block.className = 'category-block';
    block.innerHTML =
      '<div class="category-head"><h2>'+cat+'</h2><span class="category-count">'+list.length+' initiative'+(list.length===1?'':'s')+'</span></div>'+
      '<div class="grid"></div>';
    const grid = block.querySelector('.grid');
    list.forEach(i=>{
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.innerHTML =
        '<div class="tile-name">'+i.name+'</div>'+
        '<div class="tile-teaser">'+i.details[0].detail+'</div>'+
        '<div class="tile-count">'+i.details.length+' detail line'+(i.details.length===1?'':'s')+'</div>';
      tile.onclick = () => openDrawer(i.id);
      grid.appendChild(tile);
    });
    main.appendChild(block);
  });
  if(!anyVisible){
    main.innerHTML = '<p style="color:var(--ink-soft);font-size:13.5px;">No initiatives match the current filters.</p>';
  }
}

document.getElementById('search').addEventListener('input', e=>{
  searchTerm = e.target.value.toLowerCase();
  renderMain();
});

function openDrawer(id){
  const i = initIndex[id];
  if(!i) return;
  const content = document.getElementById('drawerContent');
  content.innerHTML =
    '<div class="drawer-eyebrow">'+i.category+'</div>'+
    '<h2>'+i.name+'</h2>'+
    '<div class="drawer-sub">'+i.details.length+' source line'+(i.details.length===1?'':'s')+' consolidated into this initiative</div>'+
    '<div class="related-title">Detail lines</div>'+
    '<ul class="detail-list">'+
      i.details.map(d=>'<li>'+d.detail+'<span class="detail-source">'+d.source+'</span></li>').join('')+
    '</ul>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('backdrop').onclick = closeDrawer;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

renderMain();
</script>

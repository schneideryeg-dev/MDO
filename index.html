    --st-onhold:#A5433B;     --st-onhold-100:#F3E0DD;

    --imp-low:#767F88;    --imp-low-100:#E7E8E6;
    --imp-medium:#B4842B; --imp-medium-100:#F3E7CF;
    --imp-high:#C1652D;   --imp-high-100:#F1DFCF;

  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:26px 32px 16px;}
  .header-inner{max-width:1160px;margin:0 auto;}
  .eyebrow{font-family:\'IBM Plex Mono\', monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}

  .category-count{font-family:\'IBM Plex Mono\', monospace;font-size:11.5px;color:#767F88;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));gap:12px;}

  .tile:hover{transform:translateY(-2px);border-color:var(--line-strong);}

  .tile-teaser{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .tile-foot{display:flex;justify-content:space-between;align-items:center;}
  .tile-count{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);}

  .backdrop{position:fixed;inset:0;background:rgba(22,35,46,0.32);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:30;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;background:var(--panel);
    box-shadow:-8px 0 30px rgba(22,35,46,0.15);transform:translateX(100%);transition:transform .22s ease;
    z-index:31;overflow-y:auto;padding:28px 26px 40px;}
  .drawer.open{transform:translateX(0);}
  .drawer-close{position:absolute;top:20px;right:20px;width:30px;height:30px;border:1px solid var(--line-strong);
    background:var(--paper);border-radius:50%;cursor:pointer;font-size:16px;line-height:1;color:var(--ink-soft);}
  .drawer-eyebrow{font-family:\'IBM Plex Mono\', monospace;font-size:11px;color:#767F88;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .drawer h2{font-size:20px;margin-bottom:6px;line-height:1.3;}
  .drawer-sub{font-family:\'IBM Plex Mono\', monospace;font-size:12px;color:#767F88;margin-bottom:20px;}

  .related-title{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#767F88;margin:0 0 10px;}
  .detail-list{list-style:none;margin:0 0 4px;padding:0;}
  .detail-item{
    padding:12px 14px;background:var(--paper);border-left:3px solid var(--line-strong);
    border-radius:8px;margin-bottom:10px;
  }
  .detail-text{font-size:13.5px;color:var(--ink);margin-bottom:4px;}
  .detail-source{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#767F88;display:block;margin-bottom:10px;}
  .detail-fields{display:grid;grid-template-columns:repeat(2, 1fr);gap:6px 10px;}
  .dfield{display:flex;flex-direction:column;gap:1px;}
  .dfield-label{font-family:\'IBM Plex Mono\', monospace;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#9298A0;}
  .dfield-value{font-size:12px;}
  .dbadge{display:inline-block;font-family:\'IBM Plex Mono\', monospace;font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;width:fit-content;}

  footer{max-width:1160px;margin:0 auto;padding:0 32px 50px;font-size:12px;color:#767F88;border-top:1px solid var(--line);padding-top:18px;}

  @media (max-width:640px){
    header{padding:20px 18px 14px;} main{padding:22px 18px 70px;} .drawer{width:100%;max-width:100%;}
    .detail-fields{grid-template-columns:1fr;}
  }
</style>
</head>

function statusClass(s){
  const k = s.toLowerCase().replace(/\s+/g,'');
  if(k==='notstarted') return 'st-notstarted';
  if(k==='inprogress') return 'st-inprogress';
  if(k==='complete'||k==='completed') return 'st-complete';
  if(k==='onhold') return 'st-onhold';
  return 'st-notstarted';
}
function impactClass(s){
  const k = s.toLowerCase();
  if(k==='low') return 'imp-low';
  if(k==='medium') return 'imp-medium';
  if(k==='high') return 'imp-high';
  if(k==='critical') return 'imp-critical';
  return 'imp-medium';
}
function decisionClass(s){
  const k = s.toLowerCase();
  if(k==='review') return 'dec-review';
  if(k==='approved') return 'dec-approved';
  if(k==='on hold'||k==='onhold') return 'dec-onhold';
  return 'dec-review';
}
function badge(cls, val){
  return '<span class="dbadge" style="background:var(--'+cls+'-100);color:var(--'+cls+')">'+val+'</span>';
}

const initiatives = [];
grouped.forEach(catGroup => {
  catGroup.initiatives.forEach(init => {
    initiatives.push({ category: catGroup.category, ...init });
  });
});
const initIndex = {}; initiatives.forEach(i => initIndex[i.id] = i);
const categories = grouped.map(c=>c.category);
let searchTerm = '';

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  let anyVisible = false;
  categories.forEach(cat=>{
    const list = initiatives.filter(i=>
      i.category===cat &&
      (searchTerm === '' ||
        i.name.toLowerCase().includes(searchTerm) ||
        i.details.some(d=>d.detail.toLowerCase().includes(searchTerm)))
    );
    if(list.length === 0) return;
    anyVisible = true;
    const block = document.createElement('div');
    block.className = 'category-block';
    block.innerHTML =
      '<div class="category-head"><h2>'+cat+'</h2><span class="category-count">'+list.length+' initiative'+(list.length===1?'':'s')+'</span></div>'+
      '<div class="grid"></div>';
    const grid = block.querySelector('.grid');
    list.forEach(i=>{
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.innerHTML =
        '<div class="tile-name">'+i.name+'</div>'+
        '<div class="tile-teaser">'+i.details[0].detail+'</div>'+
        '<div class="tile-foot"><span class="tile-count">'+i.details.length+' detail line'+(i.details.length===1?'':'s')+'</span></div>';
      tile.onclick = () => openDrawer(i.id);
      grid.appendChild(tile);
    });
    main.appendChild(block);
  });
  if(!anyVisible){
    main.innerHTML = '<p style="color:var(--ink-soft);font-size:13.5px;">No initiatives match the current search.</p>';
  }
}

document.getElementById('search').addEventListener('input', e=>{
  searchTerm = e.target.value.toLowerCase();
  renderMain();
});

function detailItem(d){
  return '<li class="detail-item">'+
    '<div class="detail-text">'+d.detail+'</div>'+
    '<span class="detail-source">'+d.source+'</span>'+
    '<div class="detail-fields">'+
      '<div class="dfield"><span class="dfield-label">Status</span>'+badge(statusClass(d.status), d.status)+'</div>'+
      '<div class="dfield"><span class="dfield-label">Target year</span><span class="dfield-value">'+d.targetYear+'</span></div>'+
      '<div class="dfield"><span class="dfield-label">ERP impact</span>'+badge(impactClass(d.erpImpact), d.erpImpact)+'</div>'+
      '<div class="dfield"><span class="dfield-label">Priority</span><span class="dfield-value">'+d.priority+'</span></div>'+
      '<div class="dfield" style="grid-column:1/-1;"><span class="dfield-label">Decision required</span>'+badge(decisionClass(d.decisionRequired), d.decisionRequired)+'</div>'+
    '</div>'+
  '</li>';
}

function openDrawer(id){
  const i = initIndex[id];
  if(!i) return;
  const content = document.getElementById('drawerContent');
  content.innerHTML =
    '<div class="drawer-eyebrow">'+i.category+'</div>'+
    '<h2>'+i.name+'</h2>'+
    '<div class="drawer-sub">'+i.details.length+' detail line'+(i.details.length===1?'':'s')+'</div>'+
    '<div class="related-title">Detail lines</div>'+
    '<ul class="detail-list">'+
      i.details.map(d=>detailItem(d)).join('')+
    '</ul>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('backdrop').onclick = closeDrawer;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

renderMain();
</script>

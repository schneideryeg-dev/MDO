<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project & Initiatives - MDO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E; --ink-soft:#3E4C58; --paper:#F7F6F1; --panel:#FFFFFF;
    --line:#DEDACE; --line-strong:#C7C2B3; --radius:10px; --shadow:0 2px 10px rgba(22,35,46,0.06);
    --accent:#B4842B; --accent-100:#F3E7CF;

    --st-notstarted:#767F88; --st-notstarted-100:#E7E8E6;
    --st-inprogress:#3B6EA5; --st-inprogress-100:#DDE7F1;
    --st-completed:#2E7D6B;  --st-completed-100:#DCEBE6;
    --st-onhold:#A5433B;     --st-onhold-100:#F3E0DD;

    --imp-low:#767F88;    --imp-low-100:#E7E8E6;
    --imp-medium:#B4842B; --imp-medium-100:#F3E7CF;
    --imp-high:#C1652D;   --imp-high-100:#F1DFCF;
    --imp-critical:#A5433B; --imp-critical-100:#F3E0DD;

    --dec-review:#3B6EA5;   --dec-review-100:#DDE7F1;
    --dec-monitor:#B4842B;  --dec-monitor-100:#F3E7CF;
    --dec-complete:#2E7D6B; --dec-complete-100:#DCEBE6;
    --dec-onhold:#A5433B;   --dec-onhold-100:#F3E0DD;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:\'IBM Plex Sans\', sans-serif;line-height:1.55;}
  h1,h2,h3{font-family:\'Source Serif 4\', serif;font-weight:600;margin:0;color:var(--ink);}

  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:26px 32px 16px;}
  .header-inner{max-width:1160px;margin:0 auto;}
  .eyebrow{font-family:\'IBM Plex Mono\', monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  h1{font-size:24px;}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;}
  .header-logo{height:52px;width:auto;flex:none;}
  @media (max-width:640px){ .header-logo{height:38px;} }

  .controls{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
  .controls-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;}
  #search{font-family:\'IBM Plex Sans\', sans-serif;font-size:13px;padding:7px 12px;border:1px solid var(--line-strong);
    border-radius:20px;background:var(--panel);min-width:260px;color:var(--ink);}
  #search:focus{outline:none;border-color:var(--ink-soft);}
  .filter-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .filter-label{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#767F88;margin-right:2px;}
  .chip-btn{font-size:12px;padding:5px 10px;border:1px solid var(--line-strong);border-radius:20px;background:var(--panel);
    cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .chip-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip-btn .chip-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .reset-btn{font-size:11.5px;padding:5px 10px;border:1px solid var(--line-strong);border-radius:20px;background:var(--paper);
    cursor:pointer;color:#767F88;font-family:\'IBM Plex Mono\', monospace;text-transform:uppercase;letter-spacing:.04em;}
  .reset-btn:hover{border-color:var(--ink-soft);color:var(--ink);}

  .dropdown-wrap{position:relative;display:inline-block;}
  .dropdown-btn{font-size:12.5px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:20px;background:var(--panel);
    cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px;font-family:\'IBM Plex Sans\', sans-serif;}
  .dropdown-btn:hover{border-color:var(--ink-soft);}
  .dropdown-btn.active-filter{border-color:var(--accent);}
  .dropdown-btn .dcount{background:var(--accent);color:#fff;font-family:\'IBM Plex Mono\', monospace;font-size:10px;
    padding:1px 6px;border-radius:10px;display:none;}
  .dropdown-btn .dcount.show{display:inline-block;}
  .dropdown-btn .chev{font-size:8px;color:#9298A0;transition:transform .15s ease;}
  .dropdown-btn.open .chev{transform:rotate(180deg);}

  .dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--line-strong);
    border-radius:10px;box-shadow:var(--shadow);padding:12px;min-width:200px;z-index:25;display:none;}
  .dropdown-panel.open{display:block;}
  .dropdown-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .dropdown-panel-clear{font-family:\'IBM Plex Mono\', monospace;font-size:10px;text-transform:uppercase;letter-spacing:.03em;
    color:#767F88;background:none;border:none;cursor:pointer;padding:0;}
  .dropdown-panel-clear:hover{color:var(--ink);}
  .dropdown-panel .filter-group{flex-direction:column;align-items:stretch;gap:5px;}
  .dropdown-panel .chip-btn{justify-content:flex-start;}

  main{max-width:1160px;margin:0 auto;padding:26px 32px 90px;}
  .category-block{margin-bottom:36px;}
  .category-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px;}
  .category-head h2{font-size:17px;}
  .category-count{font-family:\'IBM Plex Mono\', monospace;font-size:11.5px;color:#767F88;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));gap:12px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease, border-color .12s ease;
    text-align:left;width:100%;font:inherit;}
  .tile:hover{transform:translateY(-2px);border-color:var(--line-strong);}
  .tile-name{font-family:\'Source Serif 4\', serif;font-weight:600;font-size:15px;margin-bottom:10px;}
  .tile-teaser{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .tile-foot{display:flex;justify-content:space-between;align-items:center;}
  .tile-count{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);}

  .backdrop{position:fixed;inset:0;background:rgba(22,35,46,0.32);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:30;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;background:var(--panel);
    box-shadow:-8px 0 30px rgba(22,35,46,0.15);transform:translateX(100%);transition:transform .22s ease;
    z-index:31;overflow-y:auto;padding:28px 26px 40px;}
  .drawer.open{transform:translateX(0);}
  .drawer-close{position:absolute;top:20px;right:20px;width:30px;height:30px;border:1px solid var(--line-strong);
    background:var(--paper);border-radius:50%;cursor:pointer;font-size:16px;line-height:1;color:var(--ink-soft);}
  .drawer-eyebrow{font-family:\'IBM Plex Mono\', monospace;font-size:11px;color:#767F88;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .drawer h2{font-size:20px;margin-bottom:6px;line-height:1.3;}
  .drawer-sub{font-family:\'IBM Plex Mono\', monospace;font-size:12px;color:#767F88;margin-bottom:20px;}

  .related-title{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#767F88;margin:0 0 10px;}
  .detail-list{list-style:none;margin:0 0 4px;padding:0;}
  .detail-item{
    padding:16px 18px;background:var(--panel);border:1.5px solid #A39D8E;border-left:4px solid #8B8578;
    border-radius:10px;margin-bottom:12px;
  }
  .detail-text{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.5;}
  .detail-source{font-family:\'IBM Plex Mono\', monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-soft);font-weight:500;display:block;margin-bottom:14px;}
  .detail-fields{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px 16px;padding-top:14px;border-top:1px solid var(--line);}
  .dfield{display:flex;flex-direction:column;gap:4px;}
  .dfield-label{font-family:\'IBM Plex Mono\', monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
    color:#5B6067;font-weight:600;}
  .dfield-value{font-size:14px;color:var(--ink);font-weight:500;}
  .dbadge{display:inline-block;font-family:\'IBM Plex Sans\', sans-serif;font-size:12.5px;font-weight:600;
    padding:4px 11px;border-radius:20px;white-space:nowrap;width:fit-content;border:1px solid currentColor;}

  footer{max-width:1160px;margin:0 auto;padding:0 32px 50px;font-size:12px;color:#767F88;border-top:1px solid var(--line);padding-top:18px;}

  @media (max-width:640px){
    header{padding:20px 18px 14px;} main{padding:22px 18px 70px;} .drawer{width:100%;max-width:100%;}
    .detail-fields{grid-template-columns:1fr;}
  }
</style>
</head>

function statusClass(s){
  const k = s.toLowerCase().replace(/\s+/g,'');
  if(k==='notstarted') return 'st-notstarted';
  if(k==='inprogress') return 'st-inprogress';
  if(k==='completed'||k==='complete') return 'st-completed';
  if(k==='onhold') return 'st-onhold';
  return 'st-notstarted';
}
function impactClass(s){
  const k = s.toLowerCase();
  if(k==='low') return 'imp-low';
  if(k==='medium') return 'imp-medium';
  if(k==='high') return 'imp-high';
  if(k==='critical') return 'imp-critical';
  return 'imp-medium';
}
function decisionClass(s){
  const k = s.toLowerCase().replace(/\s+/g,'');
  if(k==='review') return 'dec-review';
  if(k==='monitor') return 'dec-monitor';
  if(k==='complete'||k==='completed') return 'dec-complete';
  if(k==='onhold') return 'dec-onhold';
  return 'dec-review';
}
function priorityClass(s){
  const k = s.toLowerCase();
  if(k==='high') return 'imp-high';
  if(k==='medium') return 'imp-medium';
  if(k==='low') return 'imp-low';
  return 'imp-low';
}
function badge(cls, val){
  return '<span class="dbadge" style="background:var(--'+cls+'-100);color:var(--'+cls+')">'+val+'</span>';
}

const initiatives = [];

  catGroup.initiatives.forEach(init => {
    initiatives.push({ category: catGroup.category, ...init });
  });
});
const initIndex = {}; initiatives.forEach(i => initIndex[i.id] = i);
const categories = grouped.map(c=>c.category);
let searchTerm = '';

// collect distinct filter values across all detail lines
const STATUS_VALUES = [...new Set(initiatives.flatMap(i=>i.details.map(d=>d.status)))].sort();
const YEAR_VALUES = [...new Set(initiatives.flatMap(i=>i.details.map(d=>d.targetYear)))].sort();
const IMPACT_VALUES = [...new Set(initiatives.flatMap(i=>i.details.map(d=>d.erpImpact)))].sort();
const PRIORITY_VALUES = [...new Set(initiatives.flatMap(i=>i.details.map(d=>d.priority)))].sort();

const selectedStatus = new Set();
const selectedYear = new Set();
const selectedImpact = new Set();
const selectedPriority = new Set();

const FILTER_DEFS = [
  { field: 'status', label: 'Status', values: STATUS_VALUES, selectedSet: selectedStatus, classFn: statusClass },
  { field: 'targetYear', label: 'Target year', values: YEAR_VALUES, selectedSet: selectedYear, classFn: null },
  { field: 'erpImpact', label: 'ERP impact', values: IMPACT_VALUES, selectedSet: selectedImpact, classFn: impactClass },
  { field: 'priority', label: 'Priority', values: PRIORITY_VALUES, selectedSet: selectedPriority, classFn: priorityClass }
];

function detailMatchesFilters(d){
  return FILTER_DEFS.every(def => def.selectedSet.size === 0 || def.selectedSet.has(d[def.field]));
}

function initiativeHasMatchingDetail(init){
  return init.details.some(d => detailMatchesFilters(d));
}

      const isOpen = panel.classList.contains('open');
      closeAllDropdowns();
      if(!isOpen){ panel.classList.add('open'); btn.classList.add('open'); }
    };

    const panel = document.createElement('div');
    panel.className = 'dropdown-panel';
    panel.innerHTML =
      '<div class="dropdown-panel-head"><span class="filter-label">'+def.label+'</span>'+
      '<button class="dropdown-panel-clear">Clear</button></div>'+
      '<div class="filter-group"></div>';
    panel.querySelector('.dropdown-panel-clear').onclick = (e) => {
      e.stopPropagation();
      def.selectedSet.clear();
      refreshDropdowns();
      renderMain();
    };
    panel.onclick = (e) => e.stopPropagation();

    wrap.appendChild(btn);
    wrap.appendChild(panel);
    row.appendChild(wrap);
    def._btn = btn; def._panel = panel;
  });
  refreshDropdowns();
}

function refreshDropdowns(){
  FILTER_DEFS.forEach(def=>{
    const container = def._panel.querySelector('.filter-group');
    container.innerHTML = '';
    def.values.forEach(val=>{
      const count = initiatives.filter(i=>i.details.some(d=>d[def.field]===val)).length;
      const chip = document.createElement('button');
      chip.className = 'chip-btn' + (def.selectedSet.has(val) ? ' selected' : '');
      const dot = def.classFn ? '<span class="chip-dot" style="background:var(--'+def.classFn(val)+')"></span>' : '';
      chip.innerHTML = dot + val + ' (' + count + ')';
      chip.onclick = () => {
        if(def.selectedSet.has(val)) def.selectedSet.delete(val); else def.selectedSet.add(val);
        refreshDropdowns();
        renderMain();
      };
      container.appendChild(chip);
    });
    const countEl = def._btn.querySelector('.dcount');
    countEl.textContent = def.selectedSet.size;
    countEl.classList.toggle('show', def.selectedSet.size > 0);
    def._btn.classList.toggle('active-filter', def.selectedSet.size > 0);
  });
}

document.addEventListener('click', closeAllDropdowns);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeAllDropdowns(); });

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  let anyVisible = false;
  categories.forEach(cat=>{
    const list = initiatives.filter(i=>
      i.category===cat &&
      initiativeHasMatchingDetail(i) &&
      (searchTerm === '' ||
        i.name.toLowerCase().includes(searchTerm) ||
        i.details.some(d=>d.detail.toLowerCase().includes(searchTerm)))
    );
    if(list.length === 0) return;
    anyVisible = true;
    const block = document.createElement('div');
    block.className = 'category-block';
    block.innerHTML =
      '<div class="category-head"><h2>'+cat+'</h2><span class="category-count">'+list.length+' initiative'+(list.length===1?'':'s')+'</span></div>'+
      '<div class="grid"></div>';
    const grid = block.querySelector('.grid');
    list.forEach(i=>{
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.innerHTML =
        '<div class="tile-name">'+i.name+'</div>'+
        '<div class="tile-foot"><span class="tile-count">'+i.details.length+' detail line'+(i.details.length===1?'':'s')+'</span></div>';
      tile.onclick = () => openDrawer(i.id);
      grid.appendChild(tile);
    });
    main.appendChild(block);
  });
  if(!anyVisible){
    main.innerHTML = '<p style="color:var(--ink-soft);font-size:13.5px;">No initiatives match the current search.</p>';
  }
}

document.getElementById('search').addEventListener('input', e=>{
  searchTerm = e.target.value.toLowerCase();
  renderMain();
});

function detailItem(d){
  return '<li class="detail-item">'+
    '<div class="detail-text">'+d.detail+'</div>'+
    '<span class="detail-source">'+d.source+'</span>'+
    '<div class="detail-fields">'+
      '<div class="dfield"><span class="dfield-label">Status</span>'+badge(statusClass(d.status), d.status)+'</div>'+
      '<div class="dfield"><span class="dfield-label">Target year</span>'+badge('imp-low', d.targetYear)+'</div>'+
      '<div class="dfield"><span class="dfield-label">ERP impact</span>'+badge(impactClass(d.erpImpact), d.erpImpact)+'</div>'+
      '<div class="dfield"><span class="dfield-label">Priority</span>'+badge(priorityClass(d.priority), d.priority)+'</div>'+
      '<div class="dfield" style="grid-column:1/-1;"><span class="dfield-label">Decision required</span>'+badge(decisionClass(d.decisionRequired), d.decisionRequired)+'</div>'+
    '</div>'+
  '</li>';
}

function openDrawer(id){
  const i = initIndex[id];
  if(!i) return;
  const anyFilterActive = FILTER_DEFS.some(def => def.selectedSet.size > 0);
  const shownDetails = anyFilterActive ? i.details.filter(d => detailMatchesFilters(d)) : i.details;
  const hiddenCount = i.details.length - shownDetails.length;
  const content = document.getElementById('drawerContent');
  content.innerHTML =
    '<div class="drawer-eyebrow">'+i.category+'</div>'+
    '<h2>'+i.name+'</h2>'+
    '<div class="drawer-sub">'+shownDetails.length+' of '+i.details.length+' detail line'+(i.details.length===1?'':'s')+
      (hiddenCount > 0 ? ' shown (filtered by current selection)' : '')+'</div>'+
    '<div class="related-title">Detail lines</div>'+
    '<ul class="detail-list">'+
      shownDetails.map(d=>detailItem(d)).join('')+
    '</ul>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('backdrop').onclick = closeDrawer;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

buildDropdowns();
renderMain();
</script>
</body>
</html>
